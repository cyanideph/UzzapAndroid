name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optimize-anim-icons:
    name: Convert GIF assets to WebP
    if: github.event_name == 'pull_request' && github.head_ref == 'optimize/anim-icons-webp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert and replace GIF assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageSequence

          root = Path("app/src/main/assets/anim-icons")
          gifs = sorted(root.glob("*.gif"))
          if not gifs:
              print("No GIF assets remain.")
              raise SystemExit(0)

          before_total = sum(p.stat().st_size for p in gifs)
          after_total = 0

          for src in gifs:
              dst = src.with_suffix(".webp")
              with Image.open(src) as im:
                  frames = [frame.convert("RGBA") for frame in ImageSequence.Iterator(im)]
                  durations = [max(10, int(getattr(frame, "info", {}).get("duration", im.info.get("duration", 100) or 100))) for frame in ImageSequence.Iterator(im)]
                  loop = int(im.info.get("loop", 0) or 0)
                  frames[0].save(
                      dst, "WEBP", save_all=True, append_images=frames[1:],
                      duration=durations, loop=loop, quality=90, method=6,
                      minimize_size=True, allow_mixed=True,
                  )
              after_total += dst.stat().st_size
              print(f"{src.name}: {src.stat().st_size:,} -> {dst.name}: {dst.stat().st_size:,}")

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".kt",".java",".xml",".json",".txt",".md",".gradle",".kts",".properties",".html",".js",".ts",".tsx",".css",".yml",".yaml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(".gif", ".webp")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          for src in gifs:
              src.unlink()

          print(f"GIF total:  {before_total:,} bytes")
          print(f"WebP total: {after_total:,} bytes")
          print(f"Reduction:   {before_total-after_total:,} bytes ({(1-after_total/before_total):.1%})")
          PY

      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "perf: convert animated GIF assets to WebP"
          git push origin HEAD:optimize/anim-icons-webp

  build-and-test:
    name: Build and Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Supabase client key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ github.actor == 'dependabot[bot]' && 'sb_publishable_ci_placeholder' || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY GitHub Actions secret is missing."
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo "Supabase publishable key is configured." ;;
            *) echo "Invalid Supabase publishable key format."; exit 1 ;;
          esac

      - name: Run unit tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ github.actor == 'dependabot[bot]' && 'sb_publishable_ci_placeholder' || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:testDebugUnitTest -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --stacktrace

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ github.actor == 'dependabot[bot]' && 'sb_publishable_ci_placeholder' || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --stacktrace

      - name: Publish debug APK to GitHub Release
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "Debug APK not found."; exit 1; }

          TAG="debug-latest"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$APK" \
            --title "Uzzap Debug APK (latest)" \
            --prerelease \
            --notes "Automated Uzzap debug APK from commit $GITHUB_SHA. This release is replaced by the next successful debug build."
