name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and package debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hrjgblvxhtbopuyzyasu.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Validate Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_ACTOR" != "dependabot[bot]" ]]; then
            test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing."; exit 1; }
            test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is missing."; exit 1; }
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo "Supabase publishable key format is valid." ;;
            *) echo "Invalid Supabase publishable key format."; exit 1 ;;
          esac
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be an HTTPS Supabase project URL."; exit 1 ;;
          esac
      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace
      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace
      - name: Upload debug APK artifact
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: uzzap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      - name: Explain artifact upload failure
        if: steps.upload_apk.outcome == 'failure'
        run: |
          echo "::warning::The debug APK built successfully, but GitHub artifact upload failed. Check Actions artifact storage quota. The manual release job rebuilds and publishes the APK without depending on artifacts."

  publish-debug-apk:
    name: Rebuild and publish debug APK to GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hrjgblvxhtbopuyzyasu.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Rebuild debug APK for release
        run: |
          ./gradlew :app:assembleDebug \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace
      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "Debug APK not found after rebuild."; exit 1; }
          TAG="debug-latest"
          NOTES="Automated Uzzap debug APK from commit $GITHUB_SHA. Updated by the latest successful manual build."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Uzzap Debug APK (latest)" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$APK" --title "Uzzap Debug APK (latest)" --prerelease --notes "$NOTES"
          fi
