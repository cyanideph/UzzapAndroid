name: Nightly Uzzap Health Check

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-health
  cancel-in-progress: false

jobs:
  health:
    name: Nightly Android unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hrjgblvxhtbopuyzyasu.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Validate Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing."; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is missing."; exit 1; }
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "Invalid SUPABASE_URL"; exit 1 ;; esac
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "Invalid Supabase publishable key format."; exit 1 ;; esac
      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace
