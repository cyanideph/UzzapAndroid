name: Optimize animated assets

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch containing the GIF assets to optimize"
        required: true
        default: "optimize/anim-icons-webp"
        type: string

permissions:
  contents: write

jobs:
  convert-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || 'optimize/anim-icons-webp' }}

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert GIF assets to animated WebP
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageSequence

          root = Path("app/src/main/assets/anim-icons")
          gifs = sorted(root.glob("*.gif"))
          if len(gifs) != 39:
              raise SystemExit(f"Expected 39 GIF assets, found {len(gifs)}")

          total_before = 0
          total_after = 0

          for src in gifs:
              dst = src.with_suffix(".webp")
              with Image.open(src) as im:
                  frames = []
                  durations = []
                  for frame in ImageSequence.Iterator(im):
                      frames.append(frame.convert("RGBA"))
                      durations.append(max(10, int(frame.info.get("duration", im.info.get("duration", 100) or 100))))

                  first, rest = frames[0], frames[1:]
                  first.save(
                      dst,
                      "WEBP",
                      save_all=True,
                      append_images=rest,
                      duration=durations,
                      loop=int(im.info.get("loop", 0) or 0),
                      quality=90,
                      method=6,
                      minimize_size=True,
                      allow_mixed=True,
                  )

              before = src.stat().st_size
              after = dst.stat().st_size
              total_before += before
              total_after += after
              print(f"{src.name}: {before:,} -> {dst.name}: {after:,} bytes")

          print(f"GIF total:  {total_before:,} bytes")
          print(f"WebP total: {total_after:,} bytes")
          print(f"Reduction: {(1 - total_after / total_before):.1%}")

      - name: Update text references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          extensions = {
              ".kt", ".java", ".xml", ".json", ".txt", ".md", ".gradle",
              ".kts", ".properties", ".html", ".js", ".ts", ".tsx", ".css",
              ".yml", ".yaml"
          }

          changed = 0
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(".gif", ".webp")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated: {path}")
                  changed += 1

          print(f"Text files updated: {changed}")
          PY

      - name: Remove original GIF assets
        run: find app/src/main/assets/anim-icons -type f -name '*.gif' -delete

      - name: Verify converted assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("app/src/main/assets/anim-icons")
          webps = sorted(root.glob("*.webp"))
          if len(webps) != 39:
              raise SystemExit(f"Expected 39 WebP assets, found {len(webps)}")

          for path in webps:
              with Image.open(path) as im:
                  frames = getattr(im, "n_frames", 1)
                  if frames < 1:
                      raise SystemExit(f"Invalid WebP: {path}")
                  print(f"{path.name}: {im.size[0]}x{im.size[1]}, frames={frames}, bytes={path.stat().st_size:,}")

          leftovers = list(root.glob("*.gif"))
          if leftovers:
              raise SystemExit(f"GIF leftovers remain: {leftovers}")

          print("All 39 animated assets verified.")
          PY

      - name: Commit optimized assets to target branch
        shell: bash
        run: |
          target="${{ github.event.inputs.target_branch || 'optimize/anim-icons-webp' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/anim-icons
          git add -A -- '*.kt' '*.java' '*.xml' '*.json' '*.txt' '*.md' '*.gradle' '*.kts' '*.properties' '*.html' '*.js' '*.ts' '*.tsx' '*.css' '*.yml' '*.yaml'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf: convert animated GIF assets to WebP"
          git push origin "HEAD:$target"
