name: Optimize animated assets

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert GIF assets to animated WebP
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageSequence

          root = Path("app/src/main/assets/anim-icons")
          gifs = sorted(root.glob("*.gif"))
          if not gifs:
              print("No GIF assets found; conversion already complete.")
              raise SystemExit(0)

          total_before = 0
          total_after = 0

          for src in gifs:
              dst = src.with_suffix(".webp")
              with Image.open(src) as im:
                  frames = []
                  durations = []
                  for frame in ImageSequence.Iterator(im):
                      frames.append(frame.convert("RGBA"))
                      durations.append(max(10, int(frame.info.get("duration", im.info.get("duration", 100) or 100))))

                  loop = int(im.info.get("loop", 0) or 0)
                  first, rest = frames[0], frames[1:]

                  first.save(
                      dst,
                      "WEBP",
                      save_all=True,
                      append_images=rest,
                      duration=durations,
                      loop=loop,
                      quality=90,
                      method=6,
                      minimize_size=True,
                      allow_mixed=True,
                  )

              before = src.stat().st_size
              after = dst.stat().st_size
              total_before += before
              total_after += after
              print(f"{src.name}: {before:,} -> {dst.name}: {after:,} bytes")

          print(f"Converted: {len(gifs)} GIF assets")
          print(f"Total GIF bytes: {total_before:,}")
          print(f"Total WebP bytes: {total_after:,}")
          print(f"Reduction: {total_before - total_after:,} bytes ({(1-total_after/total_before):.1%})")
          PY

      - name: Update text references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          extensions = {".kt", ".java", ".xml", ".json", ".txt", ".md", ".gradle", ".kts", ".properties", ".html", ".js", ".ts", ".tsx", ".css", ".yml", ".yaml"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(".gif", ".webp")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated: {path}")
          PY

      - name: Remove original GIF assets
        run: find app/src/main/assets/anim-icons -type f -name '*.gif' -delete

      - name: Verify WebP assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("app/src/main/assets/anim-icons")
          webps = sorted(root.glob("*.webp"))
          if not webps:
              raise SystemExit("No WebP assets found.")
          for path in webps:
              with Image.open(path) as im:
                  print(f"{path.name}: {im.width}x{im.height}, frames={getattr(im, 'n_frames', 1)}, bytes={path.stat().st_size:,}")
          print(f"Verified {len(webps)} WebP assets.")
          PY

      - name: Commit and push optimized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf: convert animated GIF assets to WebP"
          git fetch origin optimize/anim-icons-webp
          git rebase origin/optimize/anim-icons-webp
          git push origin HEAD:optimize/anim-icons-webp
