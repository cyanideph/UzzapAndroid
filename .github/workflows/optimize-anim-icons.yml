name: Optimize animated assets

on:
  push:
    branches:
      - 'optimize/anim-icons-webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimize/anim-icons-webp

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert GIF assets to animated WebP
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageSequence
          root = Path("app/src/main/assets/anim-icons")
          gifs = sorted(root.glob("*.gif"))
          if not gifs:
              print("No GIF assets found.")
              raise SystemExit(0)
          for src in gifs:
              dst = src.with_suffix(".webp")
              with Image.open(src) as im:
                  frames = [frame.convert("RGBA") for frame in ImageSequence.Iterator(im)]
                  durations = [max(10, int(frame.info.get("duration", im.info.get("duration", 100) or 100))) for frame in ImageSequence.Iterator(im)]
                  first, rest = frames[0], frames[1:]
                  first.save(dst, "WEBP", save_all=True, append_images=rest,
                             duration=durations, loop=int(im.info.get("loop", 0) or 0),
                             quality=90, method=6, minimize_size=True, allow_mixed=True)
          PY

      - name: Update references and remove GIFs
        run: |
          python <<'PY'
          from pathlib import Path
          exts={".kt",".java",".xml",".json",".txt",".md",".gradle",".kts",".properties",".html",".js",".ts",".tsx",".css",".yml",".yaml"}
          for p in Path(".").rglob("*"):
              if p.is_file() and ".git" not in p.parts and p.suffix.lower() in exts:
                  try: s=p.read_text(encoding="utf-8")
                  except: continue
                  u=s.replace(".gif",".webp")
                  if u!=s: p.write_text(u,encoding="utf-8")
          PY
          find app/src/main/assets/anim-icons -type f -name '*.gif' -delete

      - name: Verify WebP assets
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          ps=sorted(Path("app/src/main/assets/anim-icons").glob("*.webp"))
          if len(ps) != 39: raise SystemExit(f"Expected 39 WebPs, found {len(ps)}")
          for p in ps:
              with Image.open(p) as im: im.verify()
          print(f"Verified {len(ps)} WebP assets.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: convert animated GIF assets to WebP"
          git push origin HEAD:optimize/anim-icons-webp
