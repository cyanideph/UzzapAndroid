name: Build Signed Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Test and build signed Android App Bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release configuration and signing secrets
        shell: bash
        env:
          SUPABASE_URL: ${ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "Invalid SUPABASE_URL"; exit 1 ;; esac
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "Invalid Supabase publishable key format"; exit 1 ;; esac
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uzzap-release.jks"
          test -s "$RUNNER_TEMP/uzzap-release.jks"

      - name: Run release unit tests
        env:
          SUPABASE_URL: ${ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PATH: ${ runner.temp }}/uzzap-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testReleaseUnitTest \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace

      - name: Build signed release AAB
        env:
          SUPABASE_URL: ${ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PATH: ${ runner.temp }}/uzzap-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --stacktrace

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzzap-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/uzzap-release.jks"

  publish-release:
    name: Publish signed AAB to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v4
        with:
          name: uzzap-release-aab
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find dist -maxdepth 2 -type f -name '*.aab' -print -quit)"
          test -n "$AAB" || { echo "Release AAB not found."; exit 1; }
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$AAB" --clobber
            gh release edit "$TAG" --title "Uzzap Android $TAG" --notes "Signed Android App Bundle for $TAG."
          else
            gh release create "$TAG" "$AAB" --title "Uzzap Android $TAG" --generate-notes
          fi
